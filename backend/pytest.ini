[pytest]
; Pytest configuration for the Spec2Tests backend.
;
; This file is the canonical pytest configuration for the project. It takes
; precedence over any `[tool.pytest.ini_options]` table in pyproject.toml.
; Keep the two in sync if both are retained; this file is the source of truth
; used by `pytest` invocations from the `backend/` directory as well as CI.

; Directories pytest should search for tests.
testpaths = tests

; Ensure the `backend/` directory (containing the `app` package) is on
; sys.path so `import app...` works regardless of the current working
; directory pytest is invoked from.
pythonpath = .

; Only discover files matching this pattern as test modules.
python_files = test_*.py

; Only collect classes prefixed with `Test` as test classes.
python_classes = Test*

; Only collect functions/methods prefixed with `test_` as test cases.
python_functions = test_*

; Default CLI options applied to every run:
;   -r a  : show extra summary info for all outcomes except passed
;   -q    : quiet output
;   --strict-markers : fail if unregistered markers are used
;   --strict-config   : fail on unrecognized config options/typos
addopts = -ra -q --strict-markers --strict-config

; Custom markers used across the test suite. Registering them here allows
; `--strict-markers` to be enforced without raising warnings for expected
; usage.
markers =
    unit: fast, isolated unit tests with no external I/O
    integration: tests that exercise multiple components together
    slow: tests that are expected to take a non-trivial amount of time

; Silence noisy, known deprecation warnings emitted by third-party
; dependencies so test output stays focused on application-level issues.
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:pypdf.*

; Minimum pytest version required to run this suite.
minversion = 8.0

; Consistent log formatting when using `-s`/`--log-cli-level`.
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
